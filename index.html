<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛒 MyShop - Boutique Interactive</title>

    <!-- Font Awesome 6 (gratuit) -->
    <link rel="stylesheet" href="./assets/fontawesome-free-6.1.1-web/css/all.min.css" />

    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loading-overlay">
        <div class="loader-spinner"></div>
        <div class="loader-text">Chargement des produits…</div>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-brand">
            <i class="fas fa-store"></i>
            <span>MyShop</span>
        </div>

        <div class="header-actions">
            <div class="search-wrapper">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher…" />
                </div>
                <select id="categoryFilter" class="filter-select">
                    <option value="all">Toutes les catégories</option>
                </select>
            </div>

            <button class="btn-icon" id="themeToggle" title="Mode Jour / Nuit">
                <i class="fas fa-moon"></i>
            </button>

            <button class="btn-icon" id="cartToggle" title="Ouvrir le panier">
                <span class="btn-icon-wrap">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge" id="cartBadge">0</span>
                </span>
            </button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">
        <div class="products-header">
            <h2>🛍️ Nos Produits</h2>
            <span class="products-count" id="productsCount">0 produits</span>
        </div>
        <div class="products-grid" id="productsGrid">
            <!-- Rempli par JS -->
        </div>
    </main>

    <!-- ===== CART OVERLAY ===== -->
    <div class="cart-overlay" id="cartOverlay"></div>

    <!-- ===== CART SIDEBAR ===== -->
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>
                🛒 Panier
                <span class="count" id="cartItemCount">0</span>
            </h2>
            <button class="btn-close-cart" id="closeCartBtn" title="Fermer">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="cart-body" id="cartBody">
            <div class="cart-empty">
                <i class="fas fa-shopping-basket"></i>
                <p>Votre panier est vide.</p>
                <small style="color:var(--text-muted)">Ajoutez des produits depuis la boutique !</small>
            </div>
            <!-- Les articles du panier seront injectés ici -->
        </div>

        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total</span>
                <span class="total-price" id="cartTotal">0,00 €</span>
            </div>
            <button class="btn-checkout" id="checkoutBtn" disabled>
                <i class="fas fa-credit-card"></i> Passer la commande
            </button>
        </div>
    </aside>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="./assets/js/script.js"></script>
</body>
</html>
